<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeoTerminal — Python Scripts</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body.script-editor-page { overflow: auto; background: var(--bg); }
    .script-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .script-top { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--bg-elevated); border-bottom:1px solid var(--border); }
    .script-top h1 { font-size:16px; margin-right:auto; }
    .script-layout { display:grid; grid-template-columns:240px minmax(420px,1fr) 360px; gap:10px; padding:10px; min-height:calc(100vh - 58px); }
    .script-panel { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); min-width:0; }
    .script-panel-title { padding:9px 10px; border-bottom:1px solid var(--border); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); }
    .script-list { padding:6px; max-height:calc(100vh - 160px); overflow:auto; }
    .script-item { display:block; width:100%; text-align:left; border:0; border-radius:4px; padding:8px; margin:2px 0; background:transparent; color:var(--text); cursor:pointer; }
    .script-item:hover, .script-item.active { background:var(--bg-hover); }
    .script-item small { display:block; color:var(--text-muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .script-editor-wrap { display:flex; flex-direction:column; height:calc(100vh - 78px); min-height:540px; }
    #script-editor { flex:1; min-height:420px; }
    .script-editor-fallback { display:none; width:100%; height:100%; resize:none; border:0; outline:0; padding:14px; color:var(--text); background:var(--bg); font:13px/1.5 Consolas,monospace; }
    .script-toolbar { display:flex; align-items:center; gap:6px; padding:7px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .script-toolbar input, .script-toolbar select { min-width:0; }
    .script-status { padding:6px 9px; min-height:28px; color:var(--text-muted); font-size:11px; border-bottom:1px solid var(--border); }
    .script-status.error { color:var(--down); }
    .script-console { height:32%; min-height:170px; overflow:auto; margin:0; padding:10px; white-space:pre-wrap; word-break:break-word; color:var(--text); font:12px/1.45 Consolas,monospace; }
    .script-preview { height:43%; min-height:210px; }
    .script-side { display:flex; flex-direction:column; gap:10px; }
    .script-side .script-panel { overflow:hidden; }
    .script-chart { width:100%; height:225px; }
    .script-modal { display:none; position:fixed; inset:0; z-index:100; background:#0009; align-items:center; justify-content:center; }
    .script-modal.open { display:flex; }
    .script-modal-card { width:min(460px,92vw); background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:0 12px 40px #000b; }
    .script-modal-card h2 { font-size:14px; margin-bottom:10px; }
    .script-form { display:grid; gap:8px; }
    .script-form label { display:grid; gap:4px; color:var(--text-muted); font-size:11px; }
    .script-form input, .script-form textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:7px; }
    .script-form textarea { min-height:90px; resize:vertical; font:12px Consolas,monospace; }
    .script-modal-actions { display:flex; justify-content:flex-end; gap:7px; margin-top:12px; }
    @media (max-width:1100px) { .script-layout { grid-template-columns:210px 1fr; } .script-side { grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr; } }
    @media (max-width:700px) { .script-layout { display:block; } .script-panel:first-child { margin-bottom:10px; } .script-list { max-height:150px; } .script-editor-wrap { height:70vh; } .script-side { display:block; } }
  </style>
</head>
<body class="script-editor-page">
  <div class="script-shell">
    <header class="script-top">
      <a class="btn" href="/">← Терминал</a>
      <h1>Python Scripts</h1>
      <button class="btn" id="script-new">Новый</button>
      <button class="btn" id="script-save">Сохранить</button>
      <button class="btn ai-btn" id="script-run">▶ Run</button>
      <button class="btn" id="script-train">Train on Replay</button>
    </header>
    <div class="script-layout">
      <aside class="script-panel">
        <div class="script-panel-title">Сохранённые</div>
        <div class="script-list" id="script-list"></div>
        <div class="script-panel-title">Шаблоны</div>
        <div class="script-list" id="template-list"></div>
      </aside>
      <main class="script-panel script-editor-wrap">
        <div class="script-toolbar">
          <input id="script-name" type="text" placeholder="Имя скрипта" value="Новый скрипт">
          <select id="script-symbol"><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>EURUSD</option><option>GBPUSD</option><option>USDCHF</option><option>USDJPY</option><option>USDCAD</option><option>EURJPY</option><option>XAUUSD</option></select>
          <select id="script-timeframe"><option>1m</option><option>5m</option><option selected>15m</option><option>1H</option><option>4H</option><option>1D</option></select>
          <button class="mini-btn" id="script-delete" title="Удалить">✕</button>
        </div>
        <div id="script-editor"></div>
        <textarea class="script-editor-fallback" id="script-editor-fallback" spellcheck="false"></textarea>
        <div class="script-status" id="script-status">Загрузка…</div>
      </main>
      <aside class="script-side">
        <section class="script-panel">
          <div class="script-panel-title">Preview сигналов</div>
          <div class="script-chart" id="script-chart"></div>
        </section>
        <section class="script-panel" style="flex:1; display:flex; flex-direction:column;">
          <div class="script-panel-title">Console</div>
          <pre class="script-console" id="script-console">Выберите или создайте скрипт.</pre>
        </section>
      </aside>
    </div>
  </div>

  <div class="script-modal" id="train-modal" role="dialog" aria-modal="true" aria-labelledby="train-title">
    <div class="script-modal-card">
      <h2 id="train-title">Train on Replay</h2>
      <div class="script-form">
        <label>Параметры (JSON; массивы задают grid)
          <textarea id="train-params">{}</textarea>
        </label>
        <label>Начало (YYYY-MM-DD)<input id="train-start" type="date"></label>
        <label>Конец (YYYY-MM-DD)<input id="train-end" type="date"></label>
        <div class="script-status" id="train-status">Прогон будет без look-ahead bias.</div>
      </div>
      <div class="script-modal-actions">
        <button class="btn" id="train-cancel">Отмена</button>
        <button class="btn ai-btn" id="train-start-button">Запустить</button>
      </div>
    </div>
  </div>

  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script type="module" src="/static/js/ui/script_editor.js"></script>
</body>
</html>
